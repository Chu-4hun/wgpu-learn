[workspace]
resolver = "3"
members = ["engine", "app"]


[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"

bevy_ecs = "0.19.0"

bytemuck = { version = "1.23", features = ["derive"] }

cfg-if = "1.0"
cgmath = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-wasm = "0.2"

uuid = "1.24.0"

wgpu = "30"
winit = { version = "0.30", features = ["rwh_05"] }

futures-lite = "2.6.1"

egui = {git = "https://github.com/emilk/egui.git"}
egui-wgpu = {git = "https://github.com/emilk/egui.git"}
egui-winit = { git = "https://github.com/emilk/egui.git", default-features = false }

tobj = { version = "4.0", default-features = false, features = ["async", "futures"] }

console_error_panic_hook = "0.1"
wasm-bindgen = { version = "0.2", default-features = false }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Window", "Element", "Location"] }

reqwest = { version = "0.13" }
pollster = "0.4"

url = "2.5.8"

[workspace.build-dependencies]
anyhow = "1.0"
fs_extra = "1.3"
glob = "0.3"
profiling = "1.0"